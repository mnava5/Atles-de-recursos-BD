<!DOCTYPE html>
<html lang="ca"><head><meta charset="utf-8"/><title>Universitat</title></head><body><section id="cap-uni"><h2 style="color:#145873;font-weight:400;line-height:1.3;">Universitat</h2><p style="margin:0 0 14px;">Les etapes són una orientació per a la selecció. La correspondència amb cursos i edats d’altres països s’ha de contrastar a cada fitxa.</p><p style="margin:0 0 14px;">No hi ha cap fitxa específica d’aquesta etapa en la selecció actual.</p></section></body></html>
